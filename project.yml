name: MacTwix
options:
  bundleIdPrefix: com.webgkv
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    # Universal binary: Intel (x86_64) + Apple Silicon (arm64)
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  MacTwix:
    type: application
    platform: macOS
    sources:
      - path: MacTwix
        excludes:
          - "**/*.entitlements"
      - path: Shared
      - path: MacTwix/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webgkv.mactwix
        PRODUCT_NAME: MacTwix
        INFOPLIST_FILE: MacTwix/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacTwix/MacTwix.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - target: MacTwixHelper
        link: false
        embed: false
    postBuildScripts:
      - name: Embed Helper + LaunchDaemon plist
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP="${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}"
          HELPER_BIN="${BUILT_PRODUCTS_DIR}/MacTwixHelper"
          DEST_BIN="${APP}/Contents/MacOS/MacTwixHelper"
          DEST_PLIST_DIR="${APP}/Contents/Library/LaunchDaemons"
          mkdir -p "${APP}/Contents/MacOS"
          mkdir -p "${DEST_PLIST_DIR}"
          cp -f "${HELPER_BIN}" "${DEST_BIN}"
          cp -f "${SRCROOT}/MacTwixHelper/com.webgkv.mactwix.helper.plist" "${DEST_PLIST_DIR}/com.webgkv.mactwix.helper.plist"
          if [ -n "${CODE_SIGN_IDENTITY:-}" ] && [ "${CODE_SIGN_IDENTITY}" != "-" ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY}}" \
              --identifier "com.webgkv.mactwix.helper" \
              --entitlements "${SRCROOT}/MacTwixHelper/MacTwixHelper.entitlements" \
              --options runtime --timestamp=none "${DEST_BIN}" || true
          fi
          echo "Embedded helper into ${DEST_BIN}"
    scheme:
      gatherCoverageData: false

  MacTwixHelper:
    type: tool
    platform: macOS
    sources:
      - path: MacTwixHelper
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webgkv.mactwix.helper
        PRODUCT_NAME: MacTwixHelper
        CODE_SIGN_ENTITLEMENTS: MacTwixHelper/MacTwixHelper.entitlements
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "AppKit"
